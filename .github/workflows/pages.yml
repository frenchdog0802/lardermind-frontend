name: Deploy Cloudflare Pages

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}
  VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID }}

jobs:
  check:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    env:
      # main = production API (Actions variable/secret); dev = staging API.
      VITE_API_BASE_URL: ${{ github.ref == 'refs/heads/dev' && 'https://lardermind-api-staging.lardermind.workers.dev' || (vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Require VITE_API_BASE_URL
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "Set Actions variable or secret VITE_API_BASE_URL to the Worker base URL (no trailing slash)."
            exit 1
          fi
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: pages-dist
          path: dist/app
          retention-days: 1

  deploy:
    name: Deploy Pages
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pages-dist
          path: dist/app
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # main publishes the live site (lardermind.com).
      - name: Deploy Pages (production)
        if: github.ref == 'refs/heads/main'
        run: npx wrangler pages deploy dist/app --project-name=lardermind-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # dev publishes a branch preview (https://dev.lardermind-web.pages.dev) wired to the staging API.
      # --branch=dev is explicit so a detached CI checkout can never fall back to production.
      - name: Deploy Pages (staging preview)
        if: github.ref == 'refs/heads/dev'
        run: npx wrangler pages deploy dist/app --project-name=lardermind-web --branch=dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
